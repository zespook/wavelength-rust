<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Connect to Wavelength</title>
    <style>
      :root{font-family:Manrope,"Segoe UI",sans-serif;color:#f2f2ef;background:#101311;font-synthesis:none}
      *{box-sizing:border-box}
      body{display:grid;min-height:100vh;margin:0;padding:32px;background:radial-gradient(circle at 85% 0%,#283026 0,#101311 48%)}
      main{align-self:center;width:min(100%,420px);margin:auto}
      .mark{display:grid;place-items:center;width:40px;height:40px;border-radius:9px;background:#dce98b;color:#101311;font-size:18px;font-weight:800}
      p{margin:28px 0 6px;color:#9a9d97;font:10px Consolas,monospace;letter-spacing:1px;text-transform:uppercase}
      h1{margin:0 0 26px;font-size:28px;line-height:1.15}
      form{display:grid;gap:12px}
      label{display:grid;gap:7px;color:#9a9d97;font-size:12px}
      input{width:100%;height:44px;padding:0 12px;border:1px solid #414640;border-radius:6px;outline:0;background:#171c18;color:#f2f2ef;font:13px "Segoe UI",sans-serif}
      input:focus{border-color:#dce98b;box-shadow:0 0 0 2px #dce98b33}
      button{height:42px;border:0;border-radius:6px;background:#dce98b;color:#171a13;font-size:13px;font-weight:700;cursor:pointer}
      button:disabled{opacity:.6;cursor:progress}
      #status{min-height:18px;margin:2px 0 0;color:#ff9a91;font-size:12px}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">W</div>
      <p>Wavelength desktop</p>
      <h1>Connect to your server</h1>
      <form id="connect-form">
        <label for="server-url">Server address<input id="server-url" name="server-url" type="url" placeholder="https://music.example.com" required autofocus /></label>
        <button type="submit">Connect</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script type="module" src="/src/desktop/connect.js"></script>
  </body>
</html>
