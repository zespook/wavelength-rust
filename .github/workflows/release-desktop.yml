name: Release Wavelength Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            bundle: nsis
          - platform: macos-latest
            bundle: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # If the qobuz-rest-api repo is PRIVATE, the default token can't read it.
          # Create a personal access token with read access to that repo, save it
          # as a repository secret named SUBMODULE_TOKEN, and uncomment this line:
          # token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI and WebAssembly target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install dioxus-cli --version 0.7.10 --locked

      - name: Install project dependencies
        run: npm ci

      - name: Set app version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG;
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
            if (!match) throw new Error(`Invalid release tag: ${tag}. Expected vMAJOR.MINOR.PATCH.`);
            const configPath = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            config.version = tag.slice(1);
            fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
            console.log(`Building Wavelength ${config.version}`);
          '

      - name: Configure signed update feed
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-updater.mjs

      - name: Package local services (Windows)
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-services.ps1

      - name: Package local services (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/package-services-macos.sh

      - name: Build and publish signed release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Wavelength ${{ github.ref_name }}
          releaseBody: See the release notes for changes and fixes.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles ${{ matrix.bundle }}
