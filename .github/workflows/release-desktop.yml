name: Release Wavelength Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # If the qobuz-rest-api repo is PRIVATE, the default token can't read it.
          # Create a personal access token with read access to that repo, save it
          # as a repository secret named SUBMODULE_TOKEN, and uncomment this line:
          # token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Expected a vMAJOR.MINOR.PATCH release tag.'
          }
          $cargo = Get-Content dioxus-frontend/Cargo.toml -Raw
          if ($cargo -match '(?m)^version\s*=\s*"([^"]+)"') {
            $appVersion = $Matches[1]
          } else {
            throw 'Could not read the app version from dioxus-frontend/Cargo.toml.'
          }
          if ($appVersion -ne $env:RELEASE_TAG.Substring(1)) {
            throw 'Release tag version does not match dioxus-frontend/Cargo.toml.'
          }
          Write-Host "Building Wavelength $appVersion"

      - name: Build and package compiled services (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          & scripts\package-services.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the compiled services.' }
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'dist\release-assets'
          $archive = Join-Path $artifact "Wavelength_${version}_services_windows-x86_64.zip"
          $packageOutput = & python scripts\package-compiled-services.py dioxus-frontend\resources\services $version $archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the compiled services archive.' }
          $hashLine = $packageOutput | Where-Object { $_ -match '^sha256=[0-9a-fA-F]{64}$' } | Select-Object -First 1
          if (-not $hashLine) { throw 'Could not read the compiled service package checksum.' }
          $hash = $hashLine.Substring(7).ToLowerInvariant()
          "WAVELENGTH_SERVICES_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Build and package compiled services (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="${RELEASE_TAG#v}"
          bash scripts/package-services-unix.sh
          artifact="$GITHUB_WORKSPACE/dist/release-assets"
          archive="$artifact/Wavelength_${version}_services_${PLATFORM}.zip"
          python3 scripts/package-compiled-services.py \
            dioxus-frontend/resources/services "$version" "$archive"
          service_hash="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "WAVELENGTH_SERVICES_SHA256=$service_hash" >> "$GITHUB_ENV"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            desktop-file-utils \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Build desktop bundle (Windows)
        if: runner.os == 'Windows'
        working-directory: dioxus-frontend
        shell: pwsh
        run: dx bundle --platform desktop --release --no-default-features --features desktop --package-types nsis --out-dir "$env:GITHUB_WORKSPACE\dist\desktop"

      - name: Build desktop bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: dioxus-frontend
        shell: bash
        run: |
          dx bundle --platform desktop --release --no-default-features --features desktop \
            --package-types macos \
            --package-types updater \
            --out-dir "$GITHUB_WORKSPACE/dist/desktop"

      - name: Build desktop bundle (Linux)
        if: runner.os == 'Linux'
        working-directory: dioxus-frontend
        run: |
          dx bundle --platform desktop --release --no-default-features --features desktop \
            --package-types appimage \
            --package-types deb \
            --package-types rpm \
            --out-dir "$GITHUB_WORKSPACE/dist/desktop"

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist\desktop'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'dist\release-assets'
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $installer = Get-ChildItem -Path $out -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Dioxus did not produce the Windows NSIS installer.' }
          Copy-Item $installer.FullName (Join-Path $artifact "Wavelength_${version}_windows_x86_64.exe")

      - name: Collect macOS packages
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="${RELEASE_TAG#v}"
          out="$GITHUB_WORKSPACE/dist/desktop"
          artifact="$GITHUB_WORKSPACE/dist/release-assets"
          mkdir -p "$artifact"
          app_archive="$(find "$out" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          pkg="$out/Wavelength_${version}_${PLATFORM}.pkg"
          test -n "$app_archive" || {
            echo "Dioxus did not produce the expected macOS release assets." >&2
            exit 1
          }
          bash scripts/package-macos-pkg.sh "$version" "$app_archive" "$pkg"
          cp "$app_archive" "$artifact/Wavelength_${version}_${PLATFORM}.app.tar.gz"
          cp "$pkg" "$artifact/Wavelength_${version}_${PLATFORM}.pkg"

      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          out="$GITHUB_WORKSPACE/dist/desktop"
          artifact="$GITHUB_WORKSPACE/dist/release-assets"
          mkdir -p "$artifact"
          appimage="$(find "$out" -maxdepth 1 -type f -iname '*.AppImage' -print -quit)"
          test -n "$appimage" || {
            echo "Dioxus did not produce the expected Linux AppImage." >&2
            exit 1
          }
          cp "$appimage" "$artifact/Wavelength_${version}_linux_x86_64.AppImage"
          deb="$(find "$out" -type f -name '*.deb' -print -quit)"
          rpm="$(find "$out" -type f -name '*.rpm' -print -quit)"
          test -n "$deb" -a -n "$rpm" || {
            echo "Dioxus did not produce both Linux package formats." >&2
            exit 1
          }
          cp "$deb" "$artifact/Wavelength_${version}_linux_x86_64.deb"
          cp "$rpm" "$artifact/Wavelength_${version}_linux_x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/release-assets
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Create signed update manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/create-update-manifest.mjs "$version" \
            "windows-x86_64=dist/release-assets/Wavelength_${version}_windows_x86_64.exe" \
            "linux-x86_64=dist/release-assets/Wavelength_${version}_linux_x86_64.AppImage" \
            "darwin-x86_64=dist/release-assets/Wavelength_${version}_darwin-x86_64.app.tar.gz" \
            "darwin-aarch64=dist/release-assets/Wavelength_${version}_darwin-aarch64.app.tar.gz"

      - name: Publish desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Wavelength ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release-assets/*
            latest.json
