[package]
name = "wavelength-dioxus-frontend"
version = "0.1.8"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.10", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.dev]
debug = 0

