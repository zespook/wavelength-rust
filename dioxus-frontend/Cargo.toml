[package]
name = "wavelength-dioxus-frontend"
version = "0.1.13"
edition = "2024"

[[bin]]
name = "wavelength"
path = "src/main.rs"

[features]
default = ["desktop"]
web = ["dioxus/launch", "dioxus/web"]
desktop = [
    "dioxus/desktop",
    "dioxus/launch",
    "dep:directories",
    "dep:dark-light",
    "dep:base64",
    "dep:flate2",
    "dep:keyring",
    "dep:minisign-verify",
    "dep:open",
    "dep:reqwest",
    "dep:rfd",
    "dep:semver",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:url",
    "dep:zip",
]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = { version = "0.22", optional = true }
dioxus = { version = "=0.7.10", default-features = false, features = ["lib"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { version = "6", optional = true }
dark-light = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
keyring = { version = "3", optional = true }
minisign-verify = { version = "0.3", optional = true }
open = { version = "5", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"], optional = true }
url = { version = "2", optional = true }
zip = { version = "2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[profile.dev]
debug = 0

