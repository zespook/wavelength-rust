services:
  mongodb:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - wavelength_rooms_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavelength_rooms

  rooms-api:
    build:
      context: ./rust-backend
      dockerfile: Dockerfile.rooms
    restart: unless-stopped
    ports:
      - "${ROOM_SERVER_PORT:-5050}:5000"
    environment:
      PORT: 5000
      MUSIC_ROOT: /music
      MONGODB_URI: mongodb://mongodb:27017/wavelength
      ROOM_SERVER_PASSCODE: ${ROOM_SERVER_PASSCODE:-}
      ROOM_SERVER_TRUSTED_PROXIES: ${ROOM_SERVER_TRUSTED_PROXIES:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - wavelength_rooms_audio:/music
    networks:
      - wavelength_rooms

volumes:
  wavelength_rooms_data:
  wavelength_rooms_audio:

networks:
  wavelength_rooms:
    driver: bridge
